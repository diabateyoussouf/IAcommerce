# Application Name
spring.application.name=backend

# Configuration Serveur & Port (par défaut 8005 en local)
server.port=${SERVER_PORT:8005}

# Configuration Frontend (CORS et liens d'emails)
app.frontend.url=${FRONTEND_URL:http://localhost:3005}

# Base de données (H2 par défaut, facilement remplaçable par PostgreSQL/MySQL en prod)
spring.datasource.url=${DB_URL:jdbc:h2:mem:aicommerce-db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.mvc.format.date=yyyy-MM-dd

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.net.youssouf.backend.securities=DEBUG

